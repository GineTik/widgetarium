project: widgetarium
kind: frontend
stack: [typescript, react-hyperscript, obsidian-plugin, sucrase-widgets]

planProfile: frontend

qa:
  - name: types
    run: npm run test:types && npm run test:needs
    proves: the gateway layer under src/gateway/ typechecks; widgets are stripped, never checked
    phase: fast

  - name: suite
    run: npm test
    proves: every jsdom suite passes
    trap: jsdom resolves no cascade and lays nothing out, so a CSS claim proved here is not proved

  - name: paint
    run: npm run test:paint
    proves: resolved computed values in real headless Chrome, the only place a CSS claim is earned

  - name: flaky
    run: npm run test:dialog && npm run test:view && npm run test:drag
    proves: dialog, view and drag behaviour
    rerunAlone: true
    trap: timing-flaky; red once means re-run alone before blaming the change

  - name: lang
    run: npm run lint:lang && npm run lint:code
    proves: every shipped string is English and no sentence is built by concatenation

  - name: colors
    run: node ~/.claude/scripts/audit-colors.mjs --app src --globals styles.css
    proves: no hardcoded colours or fonts; everything through --wg-kit-* tokens

  - name: vault-install
    run: npm run dev && ls -la "$WG_VAULT/.widgetarium/widgets"
    proves: the vault runs today's engine and the scope the change touched is reachable
    phase: fast
    trap: main.js, styles.css and manifest.json are COPIED, so an uninstalled src/ change leaves
      the vault on yesterday's engine; a scope that is a real directory instead of a symlink is a
      frozen published copy and a repo edit never reaches it. @default is such a copy today.

  - name: props
    run: npm run test:props
    proves: every shipped widget's resolved props still match tools/widget-props.json
    trap: regenerate with node tools/widget-props.mjs only when a prop change is intended

smoke:
  open: npm run dev
  surface: obsidian
  path:
    - open a note holding a board - the board draws, no error boundary
    - press every control the change touched - each one answers
    - fold a sidebar and restore it - the region returns, nothing is written to the note

flows:
  - name: board
    path:
      - drag a tile between regions - it lands, the ratio holds
      - "reload the note - the layout survived and a layout tree was written, never a layouts map"
  - name: drawer
    path:
      - narrow below MAIN_FLOOR_PX - the sidebar becomes a drawer over the whole window
      - shut it and reopen - the widgets kept their refs, the note was not written
  - name: empty and error
    path:
      - open a board with no tiles - the zone invites a drop, not a blank
      - point a widget at a missing record - it says so, it does not throw

shots:
  viewports: [375, 768, 1280]
  below: MAIN_FLOOR_PX

designSource: docs/reference/<name>-draft/

delegates:
  - skill: port-design
    when: an artboard set under docs/reference/<name>-draft/ becomes a widget
    owns:
      qa: [lang, colors]
      reviewers: [fidelity]
      fixLoop: true
    adds:
      - "responsive ladder - breakpoints, @container widget over @media, the widths between frames"
      - "literal texts, date and number formats, the empty case"
      - "test:design and test:canvas"

reviewers:
  - principles-reviewer
  - cross-repo-n-plus-one-reviewer
  - dead-code-reviewer
  - duplication-reviewer
  - naming-reviewer

traps:
  - Falsification is the rule - a check that cannot be broken on purpose proves nothing. Mutate the
    source to violate the law, confirm red, restore, verify by md5.
  - A widget change is two steps - build AND install. A green suite is not a change a person sees.
  - A new widget folder is invisible in the vault until the scope is symlinked or published.
  - A markdown post-processor is reading mode only; Live Preview needs a CodeMirror 6 extension.
  - Writing never emits a new layouts: map. Reading still accepts one, per the lazy-migration law.
  - "Comments only with the TODO and TRADE-OFF prefixes; a hook blocks everything else on edits
    and on shell writes alike, and it reads markdown headings in a heredoc as comments."
