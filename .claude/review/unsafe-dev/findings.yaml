    fixed_by: session, in the main tree — insertedAt answers null, movedInto refuses the whole move, layoutWithHolder seats the holder in the first real box and addTileInto checks isBox; four new checks in tree-test and view-test, each shown to go red on a deliberate break and restored md5-identical
    file: src/tree.js
    line: 57
    claim: "insertedAt returns the tree it was GIVEN when the target path is not a box, and movedInto passes the tree whose carried leaf is already the GONE sentinel — so a `beside` drop onto a root child that is a leaf DELETES the carried tile; the wrap branch has this guard, the beside branch has none. Two entrances: a hand-edited layout whose root child is a leaf, and layoutWithHolder's Math.max(keptAt, 0) retarget on a board with no keep box, which also drops every folded view tile. addTileInto has the sibling gap: `if (!box) return` accepts a leaf and then reads box.of.length"
