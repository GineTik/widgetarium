<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<style>
					body {
						margin: 0;
						font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter var", sans-serif;
					}
					a {
						color: #6d4ee0;
					}
					a:hover {
						color: #5a3bd0;
					}

					.stage {
						--ground: #ffffff;
						--ink: #222222;
						--accent: #6d4ee0;
						--tone: #1f8a4c;
						--wg-kit-fill: color-mix(in srgb, var(--ink) 5.5%, var(--ground));
						--wg-kit-raise: color-mix(in srgb, #ffffff 12%, var(--ground));
						--wg-kit-card-edge: color-mix(in srgb, var(--ink) 9%, transparent);
						--muted: color-mix(in srgb, var(--ink) 58%, var(--ground));
						--faint: color-mix(in srgb, var(--ink) 36%, var(--ground));
						box-sizing: border-box;
						width: 660px;
						height: 510px;
						padding: 40px 50px;
						display: flex;
						align-items: center;
						justify-content: center;
						background: rgba(0, 0, 0, 0.22);
						color: var(--ink);
					}
					.stage * {
						box-sizing: border-box;
					}

					.dialog {
						position: relative;
						display: flex;
						flex-direction: column;
						gap: 14px;
						width: 100%;
						padding: 18px;
						border-radius: 16px;
						background: var(--wg-kit-raise);
						box-shadow:
							inset 0 0 0 1px var(--wg-kit-card-edge),
							0 24px 60px rgba(0, 0, 0, 0.14);
					}

					.close {
						position: absolute;
						top: 10px;
						right: 10px;
						width: 28px;
						height: 28px;
						display: inline-flex;
						align-items: center;
						justify-content: center;
						border: none;
						border-radius: 999px;
						background: var(--wg-kit-fill);
						color: var(--ink);
						cursor: pointer;
					}

					.head {
						display: flex;
						flex-direction: column;
						gap: 4px;
						padding-right: 32px;
					}
					.dialog-title {
						margin: 0;
						font-size: 15px;
						font-weight: 600;
						line-height: 1.3;
					}
					.dialog-desc {
						margin: 0;
						font-size: 13px;
						line-height: 1.45;
						color: var(--muted);
					}

					.row {
						display: flex;
						gap: 10px;
						align-items: stretch;
					}

					.cal {
						display: flex;
						flex-direction: column;
						padding: 6px 8px 8px;
						border-radius: 14px;
						background: var(--wg-kit-fill);
						flex: 1 1 auto;
					}
					.cal-head {
						display: flex;
						align-items: center;
						justify-content: space-between;
						padding: 2px 4px 6px;
					}
					.cal-month {
						font-size: 13px;
						font-weight: 600;
					}
					.cal-step {
						width: 28px;
						height: 28px;
						display: inline-flex;
						align-items: center;
						justify-content: center;
						border: none;
						border-radius: 999px;
						background: none;
						color: var(--ink);
						cursor: pointer;
					}
					.cal-grid {
						display: grid;
						grid-template-columns: repeat(7, minmax(0, 1fr));
						gap: 2px;
					}
					.cal-weekday {
						display: grid;
						place-items: center;
						height: 26px;
						font-size: 11px;
						font-weight: 500;
						color: var(--faint);
					}
					.cal-day {
						aspect-ratio: 1;
						display: grid;
						place-items: center;
						border: none;
						border-radius: 999px;
						background: none;
						font: inherit;
						font-size: 13px;
						font-variant-numeric: tabular-nums;
						color: var(--muted);
						cursor: pointer;
					}
					.cal-day.is-outside {
						color: var(--faint);
					}
					.cal-day.is-today {
						color: var(--ink);
						box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 26%, transparent);
					}
					.cal-day.is-picked {
						background: var(--accent);
						color: #ffffff;
						font-weight: 600;
						box-shadow: none;
					}

					.side {
						display: flex;
						flex-direction: column;
						gap: 10px;
						width: 224px;
					}

					.label {
						font-size: 11px;
						font-weight: 600;
						letter-spacing: 0.01em;
						color: var(--muted);
						padding-left: 4px;
					}

					.sign {
						display: inline-flex;
						padding: 2px;
						border-radius: 999px;
						background: var(--wg-kit-fill);
						position: relative;
					}
					.sign button {
						flex: 1;
						height: 30px;
						display: inline-flex;
						align-items: center;
						justify-content: center;
						border: none;
						background: none;
						border-radius: 999px;
						font: inherit;
						font-size: 14px;
						font-weight: 500;
						color: var(--muted);
						cursor: pointer;
						position: relative;
						z-index: 1;
					}
					.sign button[aria-selected="true"] {
						color: var(--ink);
						font-weight: 600;
					}
					.sign-thumb {
						position: absolute;
						top: 2px;
						bottom: 2px;
						left: 2px;
						width: calc(50% - 2px);
						border-radius: 999px;
						background: var(--wg-kit-raise);
						box-shadow:
							0 1px 2px rgba(0, 0, 0, 0.09),
							0 3px 8px rgba(0, 0, 0, 0.05);
					}

					.field {
						display: flex;
						align-items: center;
						gap: 8px;
						height: 44px;
						padding: 0 16px;
						border-radius: 999px;
						background: var(--wg-kit-fill);
					}
					.field.is-area {
						flex: 1 1 auto;
						height: auto;
						align-items: flex-start;
						padding: 13px 18px;
						border-radius: 22px;
					}
					.field-value {
						font-size: 22px;
						font-weight: 600;
						font-variant-numeric: tabular-nums;
						letter-spacing: -0.02em;
					}
					.field-unit {
						margin-left: auto;
						font-size: 13px;
						color: var(--faint);
					}
					.field-text {
						font-size: 14px;
						color: var(--faint);
					}

					.foot {
						display: flex;
						align-items: center;
						justify-content: flex-end;
						gap: 8px;
					}
					.btn {
						display: inline-flex;
						align-items: center;
						gap: 8px;
						height: 36px;
						padding: 0 18px;
						border: none;
						border-radius: 999px;
						background: var(--wg-kit-fill);
						color: var(--ink);
						font: inherit;
						font-size: 14px;
						font-weight: 600;
						cursor: pointer;
					}
					.btn.is-accent {
						background: var(--accent);
						color: #ffffff;
					}
				</style>
			</helmet>

			<div class="stage">
				<div class="dialog">
					<button type="button" class="close" aria-label="Close">
						<svg
							width="16"
							height="16"
							viewBox="0 0 20 20"
							fill="none"
							stroke="currentColor"
							stroke-width="1.8"
							stroke-linecap="round"
						>
							<path d="M6.4 6.4l7.2 7.2M13.6 6.4l-7.2 7.2"></path>
						</svg>
					</button>

					<div class="head">
						<h2 class="dialog-title">Add a record</h2>
						<p class="dialog-desc">One note lands in Metrics, named after the day and the minute.</p>
					</div>

					<div class="row">
						<div class="cal">
							<div class="cal-head">
								<button type="button" class="cal-step" aria-label="Previous month">
									<svg
										width="16"
										height="16"
										viewBox="0 0 20 20"
										fill="none"
										stroke="currentColor"
										stroke-width="1.8"
										stroke-linecap="round"
										stroke-linejoin="round"
									>
										<path d="M11.75 5.5l-4.5 4.5 4.5 4.5"></path>
									</svg>
								</button>
								<span class="cal-month">September 2026</span>
								<button type="button" class="cal-step" aria-label="Next month">
									<svg
										width="16"
										height="16"
										viewBox="0 0 20 20"
										fill="none"
										stroke="currentColor"
										stroke-width="1.8"
										stroke-linecap="round"
										stroke-linejoin="round"
									>
										<path d="M8.25 5.5l4.5 4.5-4.5 4.5"></path>
									</svg>
								</button>
							</div>
							<div class="cal-grid">
								<span class="cal-weekday">M</span>
								<span class="cal-weekday">T</span>
								<span class="cal-weekday">W</span>
								<span class="cal-weekday">T</span>
								<span class="cal-weekday">F</span>
								<span class="cal-weekday">S</span>
								<span class="cal-weekday">S</span>
								<sc-for list="{{days}}" as="day" hint-placeholder-count="35">
									<button type="button" class="{{day.style}}">{{day.number}}</button>
								</sc-for>
							</div>
						</div>

						<div class="side">
							<span class="label">Amount</span>
							<div class="sign">
								<span class="sign-thumb"></span>
								<button type="button" aria-selected="true">Add</button>
								<button type="button" aria-selected="false">Subtract</button>
							</div>
							<div class="field">
								<span class="field-value">4</span>
								<span class="field-unit">orders</span>
							</div>
							<span class="label">Note</span>
							<div class="field is-area">
								<span class="field-text">Optional</span>
							</div>
						</div>
					</div>

					<div class="foot">
						<button type="button" class="btn">Cancel</button>
						<button type="button" class="btn is-accent">Add record</button>
					</div>
				</div>
			</div>
		</x-dc>

		<script data-dc-script data-props='{"$preview": {"width": 660, "height": 510}}'>
			const LEADING = 1;
			const LENGTH = 30;
			const PICKED = 12;
			const CELLS = 35;

			class Component extends DCLogic {
				renderVals() {
					const days = [];
					for (let cell = 0; cell < CELLS; cell += 1) {
						const dayOfMonth = cell - LEADING + 1;
						const outside = dayOfMonth < 1 || dayOfMonth > LENGTH;
						const shown = outside ? new Date(2026, 8, dayOfMonth).getDate() : dayOfMonth;
						const picked = !outside && dayOfMonth === PICKED;
						days.push({
							number: shown,
							style: picked ? "cal-day is-picked" : outside ? "cal-day is-outside" : "cal-day",
						});
					}
					return { days };
				}
			}
		</script>
	</body>
</html>
