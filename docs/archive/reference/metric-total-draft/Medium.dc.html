<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<style>
					body {
						margin: 0;
						font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter var", sans-serif;
					}
					a {
						color: #6d4ee0;
					}
					a:hover {
						color: #5a3bd0;
					}

					.stage {
						--ground: #ffffff;
						--board: #fcfcfc;
						--ink: #222222;
						--accent: #6d4ee0;
						--tone: #1f8a4c;
						--wg-kit-fill: color-mix(in srgb, var(--ink) 5.5%, var(--ground));
						--wg-kit-raise: color-mix(in srgb, #ffffff 12%, var(--ground));
						--wg-plate: color-mix(in srgb, var(--ink) 4.5%, transparent);
						--wg-plate-blur: blur(22px) saturate(150%);
						--muted: color-mix(in srgb, var(--ink) 55%, var(--ground));
						box-sizing: border-box;
						width: 540px;
						height: 380px;
						padding: 40px;
						background: var(--board);
						color: var(--ink);
					}
					.stage * {
						box-sizing: border-box;
					}

					.tile {
						position: relative;
						width: 460px;
						height: 300px;
						border-radius: 16px;
						background: var(--wg-kit-raise);
						padding: 8px;
						box-shadow:
							inset 0 0 0 1px color-mix(in srgb, var(--ink) 4%, transparent),
							0 6px 47px rgba(0, 0, 0, 0.035),
							0 4px 8px rgba(0, 0, 0, 0.005);
					}

					.surface {
						position: relative;
						width: 100%;
						height: 100%;
						border-radius: 8px;
						overflow: hidden;
					}

					.chart {
						position: absolute;
						inset: 0 0 0 34%;
					}
					.chart svg {
						display: block;
						width: 100%;
						height: 100%;
					}

					.content {
						position: relative;
						z-index: 1;
						display: flex;
						flex-direction: column;
						height: 100%;
						padding: 15px 16px 13px;
						gap: 11px;
						pointer-events: none;
					}

					.head {
						display: flex;
						align-items: center;
						justify-content: space-between;
						gap: 10px;
					}
					.head-left {
						display: flex;
						align-items: center;
						gap: 9px;
					}
					.title {
						font-size: 13px;
						font-weight: 600;
						letter-spacing: -0.01em;
					}

					.seg {
						display: inline-flex;
						padding: 2px;
						border-radius: 999px;
						background: var(--wg-kit-fill);
						position: relative;
					}
					.seg button {
						width: 27px;
						height: 22px;
						display: inline-flex;
						align-items: center;
						justify-content: center;
						border: none;
						background: none;
						border-radius: 999px;
						color: var(--muted);
						cursor: pointer;
						position: relative;
						z-index: 1;
					}
					.seg button[aria-selected="true"] {
						color: var(--ink);
					}
					.seg-thumb {
						position: absolute;
						top: 2px;
						bottom: 2px;
						left: 2px;
						width: 27px;
						border-radius: 999px;
						background: var(--wg-kit-raise);
						box-shadow:
							0 1px 2px rgba(0, 0, 0, 0.09),
							0 3px 8px rgba(0, 0, 0, 0.05);
					}

					.head-right {
						display: flex;
						align-items: center;
						gap: 9px;
						font-size: 13px;
					}
					.trend {
						display: inline-flex;
						align-items: center;
						gap: 4px;
						font-weight: 600;
						color: var(--tone);
					}
					.period {
						display: inline-flex;
						align-items: center;
						gap: 3px;
						height: 26px;
						padding: 0 4px 0 9px;
						border: none;
						border-radius: 999px;
						background: none;
						font: inherit;
						font-size: 13px;
						font-weight: 500;
						color: var(--muted);
						cursor: pointer;
					}

					.headline {
						font-size: 54px;
						font-weight: 500;
						line-height: 0.92;
						letter-spacing: -0.04em;
						font-variant-numeric: tabular-nums;
					}

					.plates {
						display: grid;
						grid-template-columns: repeat(2, minmax(0, 1fr));
						gap: 8px;
						width: 184px;
					}
					.plate {
						aspect-ratio: 1;
						display: flex;
						flex-direction: column;
						justify-content: space-between;
						padding: 11px 13px 10px;
						border-radius: 19px;
						background: var(--wg-plate);
						backdrop-filter: var(--wg-plate-blur);
						-webkit-backdrop-filter: var(--wg-plate-blur);
					}
					.plate-value {
						font-size: 24px;
						font-weight: 600;
						line-height: 1;
						letter-spacing: -0.025em;
						font-variant-numeric: tabular-nums;
					}
					.plate-label {
						font-size: 11px;
						font-weight: 500;
						color: var(--muted);
					}
					.plate.is-tone .plate-value {
						color: var(--tone);
					}

					.foot {
						margin-top: auto;
						display: flex;
						align-items: center;
						gap: 6px;
						pointer-events: auto;
					}
					.btn {
						display: inline-flex;
						align-items: center;
						gap: 6px;
						height: 34px;
						padding: 0 16px 0 13px;
						border: none;
						border-radius: 999px;
						background: var(--accent);
						color: #ffffff;
						font: inherit;
						font-size: 13px;
						font-weight: 600;
						cursor: pointer;
					}
					.icon-btn {
						width: 34px;
						height: 34px;
						display: inline-flex;
						align-items: center;
						justify-content: center;
						border: none;
						border-radius: 999px;
						background: var(--wg-plate);
						backdrop-filter: var(--wg-plate-blur);
						-webkit-backdrop-filter: var(--wg-plate-blur);
						color: var(--ink);
						cursor: pointer;
					}
				</style>
			</helmet>

			<div class="stage">
				<div class="tile">
					<div class="surface">
						<div class="chart">
							<svg viewBox="0 0 560 440" preserveAspectRatio="none" aria-hidden="true">
								<defs>
									<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
										<circle cx="1" cy="1" r="1" fill="rgba(34,34,34,0.11)"></circle>
									</pattern>
									<linearGradient id="wash" x1="1" y1="0" x2="0" y2="0">
										<stop offset="0" stop-color="#1f8a4c" stop-opacity="0.13"></stop>
										<stop offset="0.82" stop-color="#1f8a4c" stop-opacity="0"></stop>
									</linearGradient>
									<linearGradient id="dotRamp" x1="0" y1="0" x2="1" y2="0">
										<stop offset="0" stop-color="#ffffff" stop-opacity="0"></stop>
										<stop offset="0.55" stop-color="#ffffff" stop-opacity="1"></stop>
									</linearGradient>
									<mask id="dotFade"><rect width="560" height="440" fill="url(#dotRamp)"></rect></mask>
									<linearGradient id="inkRamp" x1="0" y1="0" x2="1" y2="0">
										<stop offset="0" stop-color="#ffffff" stop-opacity="0"></stop>
										<stop offset="0.22" stop-color="#ffffff" stop-opacity="0.3"></stop>
										<stop offset="0.52" stop-color="#ffffff" stop-opacity="1"></stop>
									</linearGradient>
									<mask id="inkFade"><rect width="560" height="440" fill="url(#inkRamp)"></rect></mask>
									<linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
										<stop offset="0" stop-color="#1f8a4c" stop-opacity="0.24"></stop>
										<stop offset="1" stop-color="#1f8a4c" stop-opacity="0.015"></stop>
									</linearGradient>
								</defs>

								<rect width="560" height="440" fill="url(#wash)"></rect>
								<g mask="url(#dotFade)">
									<rect width="560" height="440" fill="url(#dots)"></rect>
								</g>

								<g mask="url(#inkFade)">
									<path
										d="M0 380 C10.4 365.2 20.7 343.1 31.1 335.7 C41.5 328.3 51.9 321 62.2 321 C72.6 321 83 350.5 93.3 350.5 C103.7 350.5 114.1 153.5 124.4 149.7 C134.8 145.9 145.2 147.5 155.6 143.8 C165.9 140.2 176.3 70 186.7 70 C197 70 207.4 121.2 217.8 129 C228.1 136.9 238.5 143.8 248.9 143.8 C259.3 143.8 269.6 137.3 280 135 C290.4 132.6 300.7 129 311.1 129 C321.5 129 331.9 129 342.2 129 C352.6 129 363 185.1 373.3 185.1 C383.7 185.1 394.1 140.9 404.4 140.9 C414.8 140.9 425.2 179.2 435.6 179.2 C445.9 179.2 456.3 99.5 466.7 99.5 C477 99.5 487.4 109.3 497.8 120.2 C508.1 131 518.5 197 528.9 197 C539.3 197 549.6 189.1 560 185.1 L560 440 L0 440 Z"
										fill="url(#under)"
									></path>
									<path
										d="M0 380 C10.4 365.2 20.7 343.1 31.1 335.7 C41.5 328.3 51.9 321 62.2 321 C72.6 321 83 350.5 93.3 350.5 C103.7 350.5 114.1 153.5 124.4 149.7 C134.8 145.9 145.2 147.5 155.6 143.8 C165.9 140.2 176.3 70 186.7 70 C197 70 207.4 121.2 217.8 129 C228.1 136.9 238.5 143.8 248.9 143.8 C259.3 143.8 269.6 137.3 280 135 C290.4 132.6 300.7 129 311.1 129 C321.5 129 331.9 129 342.2 129 C352.6 129 363 185.1 373.3 185.1 C383.7 185.1 394.1 140.9 404.4 140.9 C414.8 140.9 425.2 179.2 435.6 179.2 C445.9 179.2 456.3 99.5 466.7 99.5 C477 99.5 487.4 109.3 497.8 120.2 C508.1 131 518.5 197 528.9 197 C539.3 197 549.6 189.1 560 185.1"
										fill="none"
										stroke="#1f8a4c"
										stroke-width="2.2"
										stroke-linecap="round"
										stroke-linejoin="round"
										vector-effect="non-scaling-stroke"
									></path>
								</g>
							</svg>
						</div>

						<div class="content">
							<div class="head">
								<div class="head-left">
									<span class="title">Total orders</span>
									<div class="seg">
										<span class="seg-thumb"></span>
										<button type="button" aria-selected="true" aria-label="Curve">
											<svg
												width="15"
												height="15"
												viewBox="0 0 20 20"
												fill="none"
												stroke="currentColor"
												stroke-width="1.8"
												stroke-linecap="round"
												stroke-linejoin="round"
											>
												<path d="M3.6 13.2l3.5-4.3 3 2.6 3.2-4.6 3.1 3"></path>
											</svg>
										</button>
										<button type="button" aria-selected="false" aria-label="Bars">
											<svg
												width="15"
												height="15"
												viewBox="0 0 20 20"
												fill="none"
												stroke="currentColor"
												stroke-width="1.8"
												stroke-linecap="round"
											>
												<path d="M5 14.4V9.8M10 14.4V5.6M15 14.4v-2.9"></path>
											</svg>
										</button>
									</div>
								</div>
								<div class="head-right">
									<span class="trend">
										<svg
											width="14"
											height="14"
											viewBox="0 0 20 20"
											fill="none"
											stroke="currentColor"
											stroke-width="2.1"
											stroke-linecap="round"
											stroke-linejoin="round"
										>
											<path d="M10 15.4V5.5M5.7 9.8L10 5.5l4.3 4.3"></path></svg
										>66.0%
									</span>
									<button type="button" class="period">
										30d
										<svg
											width="15"
											height="15"
											viewBox="0 0 20 20"
											fill="none"
											stroke="currentColor"
											stroke-width="1.7"
											stroke-linecap="round"
											stroke-linejoin="round"
										>
											<path d="M6.4 8.6l3.6 3.4 3.6-3.4"></path>
										</svg>
									</button>
								</div>
							</div>

							<div class="headline">3.15K</div>

							<div class="plates">
								<div class="plate is-tone">
									<span class="plate-value">+4</span>
									<span class="plate-label">today</span>
								</div>
								<div class="plate">
									<span class="plate-value">205</span>
									<span class="plate-label">peak</span>
								</div>
							</div>

							<div class="foot">
								<button type="button" class="btn">
									<svg
										width="16"
										height="16"
										viewBox="0 0 20 20"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
									>
										<path d="M10 4.9v10.2M4.9 10h10.2"></path>
									</svg>
									Add record
								</button>
								<button type="button" class="icon-btn" aria-label="All records">
									<svg
										width="16"
										height="16"
										viewBox="0 0 20 20"
										fill="none"
										stroke="currentColor"
										stroke-width="1.8"
										stroke-linecap="round"
									>
										<path d="M7.4 6.2h8M7.4 10h8M7.4 13.8h8"></path>
										<circle cx="4.4" cy="6.2" r="0.9" fill="currentColor" stroke="none"></circle>
										<circle cx="4.4" cy="10" r="0.9" fill="currentColor" stroke="none"></circle>
										<circle cx="4.4" cy="13.8" r="0.9" fill="currentColor" stroke="none"></circle>
									</svg>
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</x-dc>

		<script data-dc-script data-props='{"$preview": {"width": 540, "height": 380}}'>
			class Component extends DCLogic {}
		</script>
	</body>
</html>
