<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="./support.js"></script>
	</head>
	<body>
		<x-dc>
			<helmet>
				<style>
					body {
						margin: 0;
						font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter var", sans-serif;
					}
					a {
						color: #8b6cef;
					}
					a:hover {
						color: #a189f3;
					}

					.stage {
						--ground: #1e1e1e;
						--board: #161616;
						--ink: #dadada;
						--accent: #8b6cef;
						--tone: #4ec97f;
						--wg-kit-fill: color-mix(in srgb, var(--ink) 5.5%, var(--ground));
						--wg-kit-raise: color-mix(in srgb, #ffffff 12%, var(--ground));
						--wg-plate: color-mix(in srgb, var(--ink) 4.5%, transparent);
						--wg-plate-blur: blur(22px) saturate(150%);
						--muted: color-mix(in srgb, var(--ink) 55%, var(--ground));
						box-sizing: border-box;
						width: 900px;
						height: 560px;
						padding: 40px 30px;
						background: var(--board);
						color: var(--ink);
					}
					.stage * {
						box-sizing: border-box;
					}

					.tile {
						position: relative;
						width: 840px;
						height: 480px;
						border-radius: 16px;
						background: var(--wg-kit-raise);
						padding: 8px;
						box-shadow:
							inset 0 0 0 1px color-mix(in srgb, var(--ink) 4%, transparent),
							0 6px 47px rgba(0, 0, 0, 0.28),
							0 4px 8px rgba(0, 0, 0, 0.16);
					}

					.surface {
						position: relative;
						width: 100%;
						height: 100%;
						border-radius: 8px;
						overflow: hidden;
					}

					.chart {
						position: absolute;
						inset: 0 0 0 26%;
					}
					.chart svg {
						display: block;
						width: 100%;
						height: 100%;
					}

					.tip {
						position: absolute;
						left: 44%;
						top: 128px;
						padding: 10px 15px;
						border-radius: 16px;
						background: var(--wg-kit-raise);
						box-shadow: 0 10px 30px rgba(0, 0, 0, 0.34);
						z-index: 2;
					}
					.tip-value {
						font-size: 16px;
						font-weight: 600;
						letter-spacing: -0.01em;
						white-space: nowrap;
					}
					.tip-date {
						font-size: 12px;
						color: var(--muted);
						white-space: nowrap;
					}

					.content {
						position: relative;
						z-index: 1;
						display: flex;
						flex-direction: column;
						height: 100%;
						padding: 18px 20px 16px;
						gap: 14px;
						pointer-events: none;
					}

					.head {
						display: flex;
						align-items: center;
						justify-content: space-between;
						gap: 16px;
					}
					.head-left {
						display: flex;
						align-items: center;
						gap: 12px;
					}
					.title {
						font-size: 15px;
						font-weight: 600;
						letter-spacing: -0.01em;
					}

					.seg {
						display: inline-flex;
						padding: 2px;
						border-radius: 999px;
						background: var(--wg-kit-fill);
						position: relative;
					}
					.seg button {
						width: 30px;
						height: 24px;
						display: inline-flex;
						align-items: center;
						justify-content: center;
						border: none;
						background: none;
						border-radius: 999px;
						color: var(--muted);
						cursor: pointer;
						position: relative;
						z-index: 1;
					}
					.seg button[aria-selected="true"] {
						color: var(--ink);
					}
					.seg-thumb {
						position: absolute;
						top: 2px;
						bottom: 2px;
						left: 32px;
						width: 30px;
						border-radius: 999px;
						background: var(--wg-kit-raise);
						box-shadow:
							0 1px 2px rgba(0, 0, 0, 0.3),
							0 3px 8px rgba(0, 0, 0, 0.22);
					}

					.head-right {
						display: flex;
						align-items: center;
						gap: 14px;
						font-size: 14px;
					}
					.trend {
						display: inline-flex;
						align-items: center;
						gap: 5px;
						font-weight: 600;
						color: var(--tone);
					}
					.period {
						display: inline-flex;
						align-items: center;
						gap: 6px;
						height: 30px;
						padding: 0 6px 0 12px;
						border: none;
						border-radius: 999px;
						background: none;
						font: inherit;
						font-size: 14px;
						font-weight: 500;
						color: var(--muted);
						cursor: pointer;
					}

					.headline {
						font-size: 76px;
						font-weight: 500;
						line-height: 0.92;
						letter-spacing: -0.04em;
						font-variant-numeric: tabular-nums;
					}

					.plates {
						display: grid;
						grid-template-columns: repeat(2, minmax(0, 1fr));
						gap: 8px;
						width: 236px;
					}
					.plate {
						aspect-ratio: 1;
						display: flex;
						flex-direction: column;
						justify-content: space-between;
						padding: 14px 16px 13px;
						border-radius: 22px;
						background: var(--wg-plate);
						backdrop-filter: var(--wg-plate-blur);
						-webkit-backdrop-filter: var(--wg-plate-blur);
					}
					.plate-value {
						font-size: 30px;
						font-weight: 600;
						line-height: 1;
						letter-spacing: -0.03em;
						font-variant-numeric: tabular-nums;
					}
					.plate-label {
						font-size: 12px;
						font-weight: 500;
						color: var(--muted);
					}
					.plate.is-tone .plate-value {
						color: var(--tone);
					}

					.foot {
						margin-top: auto;
						display: flex;
						align-items: center;
						gap: 8px;
						pointer-events: auto;
					}
					.btn {
						display: inline-flex;
						align-items: center;
						gap: 8px;
						height: 38px;
						padding: 0 20px 0 16px;
						border: none;
						border-radius: 999px;
						background: var(--accent);
						color: #ffffff;
						font: inherit;
						font-size: 14px;
						font-weight: 600;
						cursor: pointer;
					}
					.icon-btn {
						width: 38px;
						height: 38px;
						display: inline-flex;
						align-items: center;
						justify-content: center;
						border: none;
						border-radius: 999px;
						background: var(--wg-plate);
						backdrop-filter: var(--wg-plate-blur);
						-webkit-backdrop-filter: var(--wg-plate-blur);
						color: var(--ink);
						cursor: pointer;
					}
				</style>
			</helmet>

			<div class="stage">
				<div class="tile">
					<div class="surface">
						<div class="chart">
							<svg viewBox="0 0 560 440" preserveAspectRatio="none" aria-hidden="true">
								<defs>
									<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
										<circle cx="1" cy="1" r="1" fill="rgba(218,218,218,0.13)"></circle>
									</pattern>
									<linearGradient id="wash" x1="1" y1="0" x2="0" y2="0">
										<stop offset="0" stop-color="#4ec97f" stop-opacity="0.13"></stop>
										<stop offset="0.82" stop-color="#4ec97f" stop-opacity="0"></stop>
									</linearGradient>
									<linearGradient id="dotRamp" x1="0" y1="0" x2="1" y2="0">
										<stop offset="0" stop-color="#ffffff" stop-opacity="0"></stop>
										<stop offset="0.55" stop-color="#ffffff" stop-opacity="1"></stop>
									</linearGradient>
									<mask id="dotFade"><rect width="560" height="440" fill="url(#dotRamp)"></rect></mask>
									<linearGradient id="inkRamp" x1="0" y1="0" x2="1" y2="0">
										<stop offset="0" stop-color="#ffffff" stop-opacity="0"></stop>
										<stop offset="0.22" stop-color="#ffffff" stop-opacity="0.3"></stop>
										<stop offset="0.52" stop-color="#ffffff" stop-opacity="1"></stop>
									</linearGradient>
									<mask id="inkFade"><rect width="560" height="440" fill="url(#inkRamp)"></rect></mask>
									<linearGradient id="barSoft" x1="0" y1="0" x2="0" y2="1">
										<stop offset="0" stop-color="#4ec97f" stop-opacity="0.46"></stop>
										<stop offset="1" stop-color="#4ec97f" stop-opacity="0.1"></stop>
									</linearGradient>
									<linearGradient id="barStrong" x1="0" y1="0" x2="0" y2="1">
										<stop offset="0" stop-color="#4ec97f" stop-opacity="1"></stop>
										<stop offset="1" stop-color="#4ec97f" stop-opacity="0.4"></stop>
									</linearGradient>
								</defs>

								<rect width="560" height="440" fill="url(#wash)"></rect>
								<g mask="url(#dotFade)">
									<rect width="560" height="440" fill="url(#dots)"></rect>
								</g>

								<g mask="url(#inkFade)">
									<rect x="5" y="380" width="19.5" height="82" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="34.5" y="335.7" width="19.5" height="126.3" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="64" y="321" width="19.5" height="141" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="93.4" y="350.5" width="19.5" height="111.5" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="122.9" y="149.7" width="19.5" height="312.3" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="152.4" y="143.8" width="19.5" height="318.2" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="181.9" y="70" width="19.5" height="392" rx="9.7" fill="url(#barStrong)"></rect>
									<rect x="211.3" y="129" width="19.5" height="333" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="240.8" y="143.8" width="19.5" height="318.2" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="270.3" y="135" width="19.5" height="327" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="299.7" y="129" width="19.5" height="333" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="329.2" y="129" width="19.5" height="333" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="358.7" y="185.1" width="19.5" height="276.9" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="388.2" y="140.9" width="19.5" height="321.1" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="417.6" y="179.2" width="19.5" height="282.8" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="447.1" y="99.5" width="19.5" height="362.5" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="476.6" y="120.2" width="19.5" height="341.8" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="506.1" y="197" width="19.5" height="265" rx="9.7" fill="url(#barSoft)"></rect>
									<rect x="535.5" y="185.1" width="19.5" height="276.9" rx="9.7" fill="url(#barSoft)"></rect>
								</g>
							</svg>
						</div>

						<div class="tip">
							<div class="tip-value">205 orders</div>
							<div class="tip-date">05 Sep, 2026</div>
						</div>

						<div class="content">
							<div class="head">
								<div class="head-left">
									<span class="title">Total orders</span>
									<div class="seg">
										<span class="seg-thumb"></span>
										<button type="button" aria-selected="false" aria-label="Curve">
											<svg
												width="16"
												height="16"
												viewBox="0 0 20 20"
												fill="none"
												stroke="currentColor"
												stroke-width="1.8"
												stroke-linecap="round"
												stroke-linejoin="round"
											>
												<path d="M3.6 13.2l3.5-4.3 3 2.6 3.2-4.6 3.1 3"></path>
											</svg>
										</button>
										<button type="button" aria-selected="true" aria-label="Bars">
											<svg
												width="16"
												height="16"
												viewBox="0 0 20 20"
												fill="none"
												stroke="currentColor"
												stroke-width="1.8"
												stroke-linecap="round"
											>
												<path d="M5 14.4V9.8M10 14.4V5.6M15 14.4v-2.9"></path>
											</svg>
										</button>
									</div>
								</div>
								<div class="head-right">
									<span class="trend">
										<svg
											width="15"
											height="15"
											viewBox="0 0 20 20"
											fill="none"
											stroke="currentColor"
											stroke-width="2.1"
											stroke-linecap="round"
											stroke-linejoin="round"
										>
											<path d="M10 15.4V5.5M5.7 9.8L10 5.5l4.3 4.3"></path></svg
										>66.0%
									</span>
									<button type="button" class="period">
										Past 30 days
										<svg
											width="16"
											height="16"
											viewBox="0 0 20 20"
											fill="none"
											stroke="currentColor"
											stroke-width="1.7"
											stroke-linecap="round"
											stroke-linejoin="round"
										>
											<path d="M6.4 8.6l3.6 3.4 3.6-3.4"></path>
										</svg>
									</button>
								</div>
							</div>

							<div class="headline">3.15K</div>

							<div class="plates">
								<div class="plate is-tone">
									<span class="plate-value">+4</span>
									<span class="plate-label">today</span>
								</div>
								<div class="plate">
									<span class="plate-value">205</span>
									<span class="plate-label">peak</span>
								</div>
								<div class="plate">
									<span class="plate-value">100</span>
									<span class="plate-label">low</span>
								</div>
								<div class="plate">
									<span class="plate-value">166</span>
									<span class="plate-label">avg</span>
								</div>
							</div>

							<div class="foot">
								<button type="button" class="btn">
									<svg
										width="17"
										height="17"
										viewBox="0 0 20 20"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
									>
										<path d="M10 4.9v10.2M4.9 10h10.2"></path>
									</svg>
									Add record
								</button>
								<button type="button" class="icon-btn" aria-label="All records">
									<svg
										width="17"
										height="17"
										viewBox="0 0 20 20"
										fill="none"
										stroke="currentColor"
										stroke-width="1.8"
										stroke-linecap="round"
									>
										<path d="M7.4 6.2h8M7.4 10h8M7.4 13.8h8"></path>
										<circle cx="4.4" cy="6.2" r="0.9" fill="currentColor" stroke="none"></circle>
										<circle cx="4.4" cy="10" r="0.9" fill="currentColor" stroke="none"></circle>
										<circle cx="4.4" cy="13.8" r="0.9" fill="currentColor" stroke="none"></circle>
									</svg>
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</x-dc>

		<script data-dc-script data-props='{"$preview": {"width": 900, "height": 560}}'>
			class Component extends DCLogic {}
		</script>
	</body>
</html>
