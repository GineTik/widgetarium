<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    a { color: #6d4fe0; } a:hover { color: #5a3ed0; }
  </style>
</helmet>
<div style="width: 880px; height: 620px; background: #ffffff; color: #222222; font-size: 14px; padding: 36px 44px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">

  <div style="font-size: 24px; font-weight: 640; letter-spacing: -0.3px;">Untitled board</div>
  <div style="color: #5c5c5c; line-height: 1.5; max-width: 560px;">An empty board in a note. Describe it, or pick one of the starts below.</div>

  <div style="background: #fcfcfc; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09); padding: 26px; display: flex; flex-direction: column; gap: 22px;">

    <div style="background: #ffffff; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); padding: 8px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 8px 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b6cef" stroke-width="1.8" stroke-linejoin="round" style="margin-top: 1px; flex-shrink: 0;"><path d="M12 3l2.2 5.4L20 10l-5.8 1.6L12 17l-2.2-5.4L4 10l5.8-1.6z"/></svg>
        <span style="color: #999999; line-height: 1.5; flex-grow: 1;">A habit tracker over the Habits folder, with a calendar and a streak</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding-inline: 16px; border-radius: 999px; background: #f3f3f3; font-weight: 600; color: #5c5c5c;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5c5c5c" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Habits
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5c5c5c" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </span>
        <span style="width: 42px; height: 42px; border-radius: 999px; background: #8b6cef; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 12px; color: #999999;">Or start from a folder</div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <sc-for list="{{starts}}" as="s" hint-placeholder-count="3">
          <span style="display: inline-flex; align-items: center; gap: 12px; height: 52px; padding-inline: 20px; border-radius: 999px; background: #ffffff; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09);">
            <span style="width: 30px; height: 30px; border-radius: 8px; background: {{s.wash}}; display: flex; align-items: center; justify-content: center;">
              <span style="width: 10px; height: 10px; border-radius: 3px; background: {{s.ink}};"></span>
            </span>
            <span style="font-weight: 600;">{{s.title}}</span>
            <span style="color: #999999;">{{s.why}}</span>
          </span>
        </sc-for>
      </div>
      <div style="color: #999999; line-height: 1.5;">These need no agent — they come from the fields each folder actually has.</div>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":880,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      starts: [
        { title: 'Habits', why: 'dates and a colour', wash: '#f1edfd', ink: '#8b6cef' },
        { title: 'Tasks', why: 'a status field', wash: '#e6f2fc', ink: '#3b7fd4' },
        { title: 'Reading', why: 'a number and a date', wash: '#fdf0e3', ink: '#d9822b' },
      ],
    };
  }
}
</script>
</body>
</html>
