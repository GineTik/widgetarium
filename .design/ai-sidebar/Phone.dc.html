<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    a { color: #6d4fe0; } a:hover { color: #5a3ed0; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #222222; font-size: 14px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; padding: 20px 16px 16px;">

  <div style="font-size: 22px; font-weight: 640; letter-spacing: -0.3px;">Habit tracker</div>

  <div style="display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-height: 0;">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="background: #ffffff; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); padding: 14px 16px;">
        <div style="font-size: 12px; color: #999999;">Total</div>
        <div style="padding-top: 4px;"><span style="font-size: 26px; font-weight: 640;">33</span></div>
      </div>
      <div style="background: #ffffff; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); padding: 14px 16px;">
        <div style="font-size: 12px; color: #999999;">Streak</div>
        <div style="padding-top: 4px;"><span style="font-size: 26px; font-weight: 640;">7</span></div>
      </div>
    </div>

    <div style="background: #ffffff; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); padding: 16px;">
      <div style="font-weight: 600; padding-bottom: 12px;">September</div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="31">
          <span style="height: 30px; border-radius: 999px; background: {{d.fill}}; box-shadow: inset 0 0 0 1.5px {{d.ring}};"></span>
        </sc-for>
      </div>
    </div>

    <div style="background: #ffffff; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); overflow: hidden;">
      <div style="font-size: 12px; color: #999999; padding: 14px 16px 8px;">Habits</div>
      <div style="display: flex; flex-direction: column;">
        <sc-for list="{{habits}}" as="h" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 44px; box-sizing: border-box;">
            <span style="width: 30px; height: 30px; border-radius: 8px; background: {{h.badge}}; flex-shrink: 0;"></span>
            <span style="flex-grow: 1;">{{h.name}}</span>
            <span style="width: 30px; height: 30px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px #e4e4e4;"></span>
          </div>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: flex-start; gap: 12px; background: #f3f3f3; border-radius: 16px; padding: 16px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5c5c5c" stroke-width="1.8" style="margin-top: 1px; flex-shrink: 0;"><rect x="4" y="3" width="16" height="12" rx="2"/><path d="M2 20h20" stroke-linecap="round"/></svg>
    <span style="color: #5c5c5c; line-height: 1.5;">Building boards with a prompt happens in the desktop app. Everything here stays fully usable and editable.</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const kept = [1, 2, 3, 6, 7, 9, 10, 11, 12, 15, 16, 19, 20, 23, 24, 26, 29, 30];
    const days = [{ fill: '#ffffff', ring: 'transparent' }];
    for (let n = 1; n <= 30; n += 1) {
      const on = kept.includes(n);
      days.push({ fill: on ? '#f1edfd' : '#ffffff', ring: on ? '#8b6cef' : '#e4e4e4' });
    }
    return {
      days,
      habits: [
        { name: 'Morning teeth', badge: '#8b6cef' },
        { name: 'Cleaning', badge: '#3b7fd4' },
        { name: 'English', badge: '#d9822b' },
      ],
    };
  }
}
</script>
</body>
</html>
