<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    a { color: #6d4fe0; } a:hover { color: #5a3ed0; }
  </style>
</helmet>
<div style="width: 360px; height: 720px; background: #f3f3f3; color: #222222; font-size: 14px; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999999" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.2 5.4L20 10l-5.8 1.6L12 17l-2.2-5.4L4 10l5.8-1.6z"/></svg>
    <span style="font-size: 13px; font-weight: 600; flex-grow: 1;">Widgetarium</span>
    <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 12px; border-radius: 999px; background: #e8e8e8; font-size: 12px; font-weight: 600; color: #999999;">
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #c4c4c4;"></span>no agent
    </span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; min-height: 0;">

    <div style="background: #ffffff; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); padding: 18px; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 16px; font-weight: 640;">No agent found</div>
      <div style="color: #5c5c5c; line-height: 1.5;">Widgetarium asks an agent you already have. Install any one of these, sign in there once, and the prompt wakes up.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{agents}}" as="a" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; background: #ffffff; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09); padding: 12px 16px;">
          <span style="width: 30px; height: 30px; border-radius: 8px; background: #f3f3f3; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5c5c5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>
          </span>
          <span style="flex-grow: 1; font-weight: 600;">{{a.name}}</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#999999" stroke-width="1.9" stroke-linecap="round"><path d="M8 5l7 7-7 7"/></svg>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 12px; background: #ffffff; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09); padding: 16px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5c5c5c" stroke-width="1.8" style="margin-top: 1px; flex-shrink: 0;"><circle cx="12" cy="12" r="9"/><path d="M12 11v5" stroke-linecap="round"/><circle cx="12" cy="7.8" r="0.9" fill="#5c5c5c" stroke="none"/></svg>
      <span style="color: #5c5c5c; line-height: 1.5;">Boards, the catalogue and every setting work without one.</span>
    </div>

  </div>

  <div style="padding: 12px 14px 16px;">
    <div style="background: #fcfcfc; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09); padding: 8px; display: flex; flex-direction: column; gap: 16px;">
      <div style="color: #c4c4c4; line-height: 1.45; padding: 6px 6px 0;">Prompt needs an agent</div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="display: inline-flex; align-items: center; height: 34px; padding-inline: 16px; border-radius: 999px; background: #f3f3f3; font-weight: 600; color: #5c5c5c;">Open settings</span>
        <span style="width: 42px; height: 42px; border-radius: 999px; background: #e8e8e8; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#c4c4c4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </span>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":360,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { agents: [{ name: 'Claude Code' }, { name: 'Codex' }, { name: 'Gemini CLI' }, { name: 'Ollama' }] };
  }
}
</script>
</body>
</html>
