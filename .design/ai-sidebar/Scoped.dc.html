<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    a { color: #6d4fe0; } a:hover { color: #5a3ed0; }
  </style>
</helmet>
<div style="width: 1100px; height: 760px; display: flex; background: #ffffff; color: #222222; font-size: 14px;">

  <div style="flex-grow: 1; padding: 30px 36px; display: flex; flex-direction: column; gap: 20px; min-width: 0;">
    <div style="font-size: 24px; font-weight: 640; letter-spacing: -0.3px;">Habit tracker</div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
      <div style="background: #ffffff; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); padding: 16px 18px;">
        <div style="font-size: 12px; color: #999999;">Total check-ins</div>
        <div style="padding-top: 6px;"><span style="font-size: 28px; font-weight: 640;">33</span><span style="color: #5c5c5c; padding-left: 6px;">days</span></div>
      </div>
      <div style="background: #ffffff; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); padding: 16px 18px;">
        <div style="font-size: 12px; color: #999999;">Streak</div>
        <div style="padding-top: 6px;"><span style="font-size: 28px; font-weight: 640;">7</span><span style="color: #5c5c5c; padding-left: 6px;">days</span></div>
      </div>
    </div>

    <div style="position: relative; background: #ffffff; border-radius: 16px; box-shadow: inset 0 0 0 2px #8b6cef, 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); padding: 18px 20px;">
      <div style="position: absolute; top: -17px; right: 16px; display: flex; align-items: center; gap: 4px; height: 42px; padding-inline: 8px; border-radius: 999px; background: #ffffff; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085);">
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding-inline: 16px; border-radius: 999px; background: #f1edfd; color: #6d4fe0; font-weight: 600;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6d4fe0" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l2.2 5.4L20 10l-5.8 1.6L12 17l-2.2-5.4L4 10l5.8-1.6z"/></svg>
          Ask
        </span>
        <span style="width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5c5c5c" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 4.6V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5.9z"/></svg></span>
        <span style="width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5c5c5c" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>
      </div>

      <div style="font-weight: 600; padding-bottom: 14px;">September</div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 9px;">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="31">
          <span style="height: 28px; border-radius: 999px; background: {{d.fill}}; box-shadow: inset 0 0 0 1.5px {{d.ring}};"></span>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="width: 360px; background: #f3f3f3; display: flex; flex-direction: column; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b6cef" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.2 5.4L20 10l-5.8 1.6L12 17l-2.2-5.4L4 10l5.8-1.6z"/></svg>
      <span style="font-size: 13px; font-weight: 600; flex-grow: 1;">Widgetarium</span>
      <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 12px; border-radius: 999px; background: #e8e8e8; font-size: 12px; font-weight: 600; color: #5c5c5c;">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: #08b94e;"></span>Claude Code
      </span>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 14px; min-height: 0;">
      <div style="color: #999999; line-height: 1.5;">Everything you ask now applies to the attached tile only.</div>
    </div>

    <div style="padding: 12px 14px 16px;">
      <div style="background: #ffffff; border-radius: 14px; padding: 8px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; gap: 6px;">
            <span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; background: #f1edfd; color: #6d4fe0; font-size: 12px; font-weight: 600;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6d4fe0" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18"/></svg>
              Habit month
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6d4fe0" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </span>
          </div>
          <div style="color: #999999; line-height: 1.45; padding-inline: 6px;">Make the kept days stand out more</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: flex-end;">
          <span style="width: 42px; height: 42px; border-radius: 999px; background: #8b6cef; display: flex; align-items: center; justify-content: center;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </span>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1100,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const kept = [1, 2, 3, 6, 7, 9, 10, 11, 12, 15, 16, 19, 20, 23, 24, 26, 29, 30];
    const days = [{ fill: '#ffffff', ring: 'transparent' }];
    for (let n = 1; n <= 30; n += 1) {
      const on = kept.includes(n);
      days.push({ fill: on ? '#f1edfd' : '#ffffff', ring: on ? '#8b6cef' : '#e4e4e4' });
    }
    return { days };
  }
}
</script>
</body>
</html>
