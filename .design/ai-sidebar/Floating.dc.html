<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    a { color: #6d4fe0; } a:hover { color: #5a3ed0; }
  </style>
</helmet>
<div style="width: 1100px; height: 720px; background: #ffffff; color: #222222; font-size: 14px; position: relative; overflow: hidden;">

  <div style="padding: 30px 44px; display: flex; flex-direction: column; gap: 20px;">
    <div style="font-size: 24px; font-weight: 640; letter-spacing: -0.3px;">Habit tracker</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="background: #ffffff; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); padding: 16px 18px;">
          <div style="font-size: 12px; color: #999999;">{{s.label}}</div>
          <div style="padding-top: 6px;"><span style="font-size: 28px; font-weight: 640;">{{s.value}}</span><span style="color: #5c5c5c; padding-left: 6px;">{{s.unit}}</span></div>
        </div>
      </sc-for>
    </div>
    <div style="background: #ffffff; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.09), 0 1px 2px rgba(34,34,34,0.06), 0 5px 14px rgba(34,34,34,0.085); padding: 18px 20px;">
      <div style="font-weight: 600; padding-bottom: 14px;">September</div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 9px;">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="31">
          <span style="height: 28px; border-radius: 999px; background: {{d.fill}}; box-shadow: inset 0 0 0 1.5px {{d.ring}};"></span>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 34px; width: 640px; background: rgba(255,255,255,0.94); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border-radius: 22px; box-shadow: inset 0 0 0 1px rgba(34,34,34,0.12); padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;">
      <span style="font-weight: 600;">Chose a widget</span>
      <span style="color: #999999;">Habit month</span>
      <span style="color: #999999;">for 0.3s</span>
    </div>

    <div style="color: #999999; line-height: 1.5;">Ask for a change, or type @ to point at a widget</div>

    <div style="display: flex; align-items: center; gap: 10px; padding-top: 6px;">
      <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 12px; border-radius: 999px; background: #e8e8e8; font-size: 12px; font-weight: 600; color: #5c5c5c;">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: #08b94e;"></span>Claude Code
      </span>
      <span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; background: #f1edfd; color: #6d4fe0; font-size: 12px; font-weight: 600;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6d4fe0" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18"/></svg>
        Habit month
      </span>
      <span style="flex-grow: 1;"></span>
      <span style="display: inline-flex; align-items: center; gap: 8px; height: 42px; padding-inline: 20px; border-radius: 999px; background: #f3f3f3; font-weight: 600; color: #5c5c5c;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5c5c5c" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        Voice
      </span>
      <span style="display: inline-flex; align-items: center; gap: 8px; height: 42px; padding-inline: 20px; border-radius: 999px; background: #8b6cef; color: #ffffff; font-weight: 600;">
        Send
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5v5a4 4 0 0 1-4 4H5"/><path d="M9 10l-4 4 4 4"/></svg>
      </span>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1100,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const kept = [1, 2, 3, 6, 7, 9, 10, 11, 12, 15, 16, 19, 20, 23, 24, 26, 29, 30];
    const days = [{ fill: '#ffffff', ring: 'transparent' }];
    for (let n = 1; n <= 30; n += 1) {
      const on = kept.includes(n);
      days.push({ fill: on ? '#f1edfd' : '#ffffff', ring: on ? '#8b6cef' : '#e4e4e4' });
    }
    return {
      days,
      stats: [
        { label: 'Total check-ins', value: '33', unit: 'days' },
        { label: 'Streak', value: '7', unit: 'days' },
        { label: 'This month', value: '61', unit: '%' },
      ],
    };
  }
}
</script>
</body>
</html>
