<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    a { color: #6d4ee0; } a:hover { color: #5a3fc0; }
    .room { position: relative; width: 1000px; height: 440px; background: #f6f6f6; box-sizing: border-box; }
    .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.22); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    .dialog { position: relative; display: flex; flex-direction: column; gap: 14px; width: 100%; height: 100%; padding: 18px; box-sizing: border-box; background: #ffffff; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(34, 34, 34, 0.12); }
    .close { position: absolute; top: 23px; right: 18px; width: 32px; height: 32px; border-radius: 999px; background: #f2f2f2; display: flex; align-items: center; justify-content: center; color: #222222; }
    .sub { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .side { box-sizing: border-box; width: 272px; flex: none; display: flex; flex-direction: column; gap: 16px; padding: 8px; background: #ffffff; border-radius: 14px; box-shadow: 0 1px 2px rgba(34, 34, 34, 0.06), 0 5px 14px rgba(34, 34, 34, 0.085); }
    .side-head { display: flex; flex-direction: column; gap: 4px; padding: 0 8px; }
    .side-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; color: #222222; }
    .side-lead { margin: 0; font-size: 12px; line-height: 1.45; color: #707070; }
    .group { display: flex; flex-direction: column; gap: 6px; }
    .group-label { padding: 0 16px; font-size: 12px; font-weight: 500; color: #a0a0a0; }
    .list { display: flex; flex-direction: column; background: #f6f6f6; border-radius: 14px; overflow: hidden; }
    .empty-list { margin: 0; padding: 8px 16px; font-size: 14px; color: #a0a0a0; }
    .foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
    .new-row { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 16px; box-sizing: border-box; background: #f6f6f6; border-radius: 14px; }
    .new-mark { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex: none; border-radius: 8px; background: #ededed; color: #707070; }
    .new-said { font-size: 14px; font-weight: 600; color: #222222; }
    .main { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; min-height: 0; }
    .editor { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; flex: 1; text-align: center; }
    .mark { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 999px; background: #edeafb; color: #6d4ee0; }
    .lead { margin: 0; font-size: 16px; color: #707070; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 24px; border-radius: 999px; background: #6d4ee0; font-size: 16px; font-weight: 600; color: #ffffff; }
  </style>
</helmet>
<div class="room">
  <div class="scrim">
    <div class="dialog">
      <div class="close">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.4 6.4l7.2 7.2M13.6 6.4l-7.2 7.2"></path></svg>
      </div>
      <div class="sub">
        <div class="side">
          <div class="side-head">
            <h2 class="side-title">Substitutions</h2>
            <p class="side-lead">A trigger you write in a note, and the widget it draws instead</p>
          </div>
          <div class="group">
            <span class="group-label">Rules</span>
            <div class="list">
              <p class="empty-list">Nothing here yet</p>
            </div>
          </div>
          <div class="foot">
            <div class="new-row">
              <span class="new-mark">
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4.9v10.2M4.9 10h10.2"></path></svg>
              </span>
              <span class="new-said">New substitution</span>
            </div>
          </div>
        </div>
        <div class="main">
          <div class="editor">
            <span class="mark">
              <svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="4" width="12" height="12" rx="3.4"></rect><path d="M7.4 8.2h5.2M7.4 11.6h3.2"></path></svg>
            </span>
            <p class="lead">A substitution turns a line of text into a widget</p>
            <span class="btn">New substitution</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
